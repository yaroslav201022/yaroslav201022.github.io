<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kudryavtseva Art</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            color: #2c2c2c;
            line-height: 1.6;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ШАПКА */
        .header {
            background: #ffffff;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e0e3e8;
        }

        .logo {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #2d3238;
        }

        .nav {
            display: flex;
            align-items: center;
        }

        .nav a {
            text-decoration: none;
            color: #7a8088;
            margin-left: 40px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }

        .nav a:hover,
        .nav a.active {
            color: #2d3238;
        }

        .nav a.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 1px;
            background: #2d3238;
        }

        .burger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .burger span {
            display: block;
            width: 25px;
            height: 2px;
            background: #2d3238;
            transition: all 0.3s;
        }

        .burger.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .burger.open span:nth-child(2) {
            opacity: 0;
        }
        .burger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ГЛАВНЫЙ ЭКРАН */
        .hero {
            width: 100%;
            height: 70vh;
            background-color: #e2e5ea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-placeholder {
            text-align: center;
            color: #9aa0a8;
            position: absolute;
        }

        .hero-placeholder .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .hero-placeholder p {
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* СЕКЦИИ */
        .section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        .section-title {
            text-align: center;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 60px;
            color: #5a5f66;
        }

        /* ГАЛЕРЕЯ */
        .gallery-section {
            background-color: #ffffff;
            padding: 80px 0;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 60px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9aa0a8;
            cursor: pointer;
            padding-bottom: 10px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #2d3238;
            border-bottom-color: #2d3238;
        }

        .tab-btn:hover {
            color: #2d3238;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .artwork-card {
            cursor: pointer;
            transition: transform 0.3s;
            background: #ffffff;
        }

        .artwork-card:hover {
            transform: translateY(-5px);
        }

        .artwork-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #e2e5ea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .artwork-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .artwork-info {
            text-align: center;
        }

        .artwork-info h4 {
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 4px;
            color: #2d3238;
        }

        .artwork-info p {
            font-size: 12px;
            color: #9aa0a8;
            font-weight: 300;
        }

        /* ПОПАП */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .popup-overlay.show {
            display: flex;
        }

        .popup {
            background: #ffffff;
            max-width: 800px;
            width: 90%;
            display: flex;
            flex-wrap: wrap;
            position: relative;
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #5a5f66;
            z-index: 10;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .popup-close:hover {
            background: #f0f2f5;
        }

        .popup-image {
            flex: 1;
            min-width: 300px;
            background: #e2e5ea;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .popup-details {
            flex: 1;
            min-width: 280px;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .popup-details h3 {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .popup-details .meta {
            list-style: none;
            margin-bottom: 30px;
        }

        .popup-details .meta li {
            font-size: 13px;
            color: #7a8088;
            margin-bottom: 6px;
            font-weight: 300;
        }

        .popup-details .meta li strong {
            font-weight: 500;
            color: #2d3238;
        }

        .btn-price {
            display: inline-block;
            background: #2d3238;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 30px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-price:hover {
            background: #4a5058;
        }

        /* ОБ АВТОРЕ */
        .about-block {
            display: flex;
            gap: 60px;
            align-items: center;
            flex-wrap: wrap;
        }

        .about-photo {
            flex: 1;
            min-width: 250px;
            aspect-ratio: 3 / 4;
            background-color: #e2e5ea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .about-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .about-text {
            flex: 1.5;
            min-width: 280px;
        }

        .about-text h3 {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #2d3238;
        }

        .about-text p {
            font-size: 14px;
            color: #5a5f66;
            margin-bottom: 15px;
            font-weight: 300;
            line-height: 1.8;
        }

        /* КОНТАКТЫ */
        .contacts-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-btn {
            display: inline-block;
            background: #ffffff;
            color: #2d3238;
            text-decoration: none;
            padding: 16px 40px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #d0d4da;
            transition: all 0.3s;
            text-align: center;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }

        .contact-btn:hover {
            background: #2d3238;
            color: #ffffff;
            border-color: #2d3238;
        }

        /* ПОДВАЛ */
        .footer {
            text-align: center;
            padding: 40px;
            font-size: 12px;
            color: #9aa0a8;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* КНОПКА НАВЕРХ */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: #ffffff;
            color: #2d3238;
            border: 1px solid #d0d4da;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 99;
            text-decoration: none;
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top:hover {
            background: #2d3238;
            color: #ffffff;
            border-color: #2d3238;
        }

        /* ТОСТ */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #2d3238;
            color: #ffffff;
            padding: 14px 30px;
            font-size: 13px;
            letter-spacing: 1px;
            border-radius: 4px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s;
            z-index: 200;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* АДАПТИВ */
        @media (max-width: 768px) {
            .header {
                padding: 15px 25px;
                position: relative;
            }

            .burger {
                display: flex;
            }

            .nav {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: #ffffff;
                flex-direction: column;
                padding: 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.4s ease, padding 0.4s ease;
                border-bottom: 1px solid #e0e3e8;
            }

            .nav.open {
                max-height: 300px;
                padding: 10px 0;
            }

            .nav a {
                margin: 0;
                padding: 12px 25px;
                border-top: 1px solid #f2f3f5;
            }

            .nav a.active::after {
                display: none;
            }

            .hero {
                height: 40vh;
            }

            .gallery-grid {
                grid-template-columns: 1fr 1fr;
                padding: 0 20px;
            }

            .section {
                padding: 50px 20px;
            }

            .popup {
                flex-direction: column;
                max-height: 90vh;
                overflow-y: auto;
            }

            .popup-details {
                padding: 30px 25px;
            }

            .contacts-grid {
                flex-direction: column;
            }

            .scroll-top {
                bottom: 20px;
                right: 20px;
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">Kudryavtseva</div>
        <button class="burger" id="burger" onclick="toggleMenu()" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav" id="nav">
            <a href="#hero" class="active">Главная</a>
            <a href="#works">Работы</a>
            <a href="#about">Об авторе</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <section class="hero fade-in" id="hero"></section>

    <section class="gallery-section" id="works">
        <div class="section-title fade-in">Работы</div>
        <div class="tabs fade-in" id="tabs-container"></div>
        <div id="gallery-container"></div>
    </section>

    <section class="section" id="about">
        <div class="section-title fade-in">Об авторе</div>
        <div class="about-block fade-in" id="about-container"></div>
    </section>

    <section class="section" id="contacts">
        <div class="section-title fade-in">Контакты</div>
        <div class="contacts-grid fade-in" id="contacts-container"></div>
    </section>

    <footer class="footer" id="footer-container"></footer>

    <div class="popup-overlay" id="popup-overlay" onclick="closePopup(event)">
        <div class="popup" onclick="event.stopPropagation()">
            <button class="popup-close" onclick="closePopupDirect()" aria-label="Закрыть">&times;</button>
            <div class="popup-image">
                <img id="popup-img" src="" alt="">
            </div>
            <div class="popup-details">
                <h3 id="popup-title">Название</h3>
                <ul class="meta">
                    <li><strong>Материал:</strong> <span id="popup-material">—</span></li>
                    <li><strong>Размер:</strong> <span id="popup-size">—</span></li>
                    <li><strong>Год:</strong> <span id="popup-year">—</span></li>
                </ul>
                <a href="#" class="btn-price" id="popup-link" target="_blank">Узнать цену</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Информация о мастер-классах появится позже</div>

    <a href="#hero" class="scroll-top" id="scroll-top" aria-label="Наверх">↑</a>

    <script>
        // ============================================================
        // ========== ВСЕ ДАННЫЕ САЙТА — МЕНЯТЬ ТОЛЬКО ЗДЕСЬ ==========
        // ============================================================
        const SITE_DATA = {
            artist: {
                firstName: "Елена",
                lastName: "Кудрявцева",
                city: "[город]",
                photo: "https://placehold.co/400x533/e2e5ea/9aa0a8?text=Елена",
                story: [
                    "Морской пейзаж — моя главная тема. Вода, небо, бесконечная линия горизонта и состояние природы, которое никогда не повторяется. Я пишу море более 15 лет.",
                    "Работаю маслом на холсте, а также в графике. Для меня важен свет, пространство и воздух. Картина должна оставлять место для тишины.",
                    "Живу и работаю в [городе]. Участвую в выставках с 2010 года."
                ]
            },
            hero: {
                img: "https://placehold.co/1600x900/e2e5ea/9aa0a8?text=Морской+пейзаж",
                alt: "Морской пейзаж",
                caption: "МОРСКОЙ ПЕЙЗАЖ"
            },
            tabs: [
                { id: "themes", label: "Темы" },
                { id: "graphics", label: "Графика" }
            ],
            artworks: {
                themes: [
                    {
                        title: "Название работы 1",
                        material: "Холст, масло",
                        size: "60×80 см",
                        year: "2024",
                        img: "https://placehold.co/800x600/e2e5ea/9aa0a8?text=Картина+1"
                    },
                    {
                        title: "Название работы 2",
                        material: "Холст, масло",
                        size: "50×70 см",
                        year: "2024",
                        img: "https://placehold.co/800x600/e2e5ea/9aa0a8?text=Картина+2"
                    },
                    {
                        title: "Название работы 3",
                        material: "Холст, масло",
                        size: "70×90 см",
                        year: "2023",
                        img: "https://placehold.co/800x600/e2e5ea/9aa0a8?text=Картина+3"
                    }
                ],
                graphics: [
                    {
                        title: "Графика 1",
                        material: "Бумага, пастель",
                        size: "30×40 см",
                        year: "2024",
                        img: "https://placehold.co/800x600/e2e5ea/9aa0a8?text=Графика+1"
                    },
                    {
                        title: "Графика 2",
                        material: "Бумага, пастель",
                        size: "42×30 см",
                        year: "2024",
                        img: "https://placehold.co/800x600/e2e5ea/9aa0a8?text=Графика+2"
                    }
                ]
            },
            contacts: {
                telegram: "kudryavtseva",
                email: "elena@kudryavtseva.art",
                social: "#",
                socialLabel: "Соцсети"
            },
            footer: {
                text: "© 2026 Kudryavtseva Art. Все права защищены."
            }
        };

        // ========== ПОСТРОЕНИЕ САЙТА ==========
        function buildSite() {
            const hero = document.getElementById('hero');
            if (SITE_DATA.hero.img) {
                hero.innerHTML = '<img src="' + SITE_DATA.hero.img + '" alt="' + SITE_DATA.hero.alt + '">';
            }

            const tabsContainer = document.getElementById('tabs-container');
            SITE_DATA.tabs.forEach(function(tab, i) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
                btn.textContent = tab.label;
                btn.setAttribute('data-tab', tab.id);
                btn.onclick = function() { switchTab(tab.id, this); };
                tabsContainer.appendChild(btn);
            });

            const galleryContainer = document.getElementById('gallery-container');
            SITE_DATA.tabs.forEach(function(tab, tabIndex) {
                const tabDiv = document.createElement('div');
                tabDiv.className = 'tab-content' + (tabIndex === 0 ? ' active' : '');
                tabDiv.id = 'tab-' + tab.id;
                
                const grid = document.createElement('div');
                grid.className = 'gallery-grid fade-in';
                
                const artworks = SITE_DATA.artworks[tab.id] || [];
                artworks.forEach(function(artwork, index) {
                    const card = document.createElement('div');
                    card.className = 'artwork-card';
                    card.onclick = function() { openPopup(tab.id, index); };
                    
                    card.innerHTML = 
                        '<div class="artwork-image">' +
                            '<img src="' + artwork.img + '" alt="' + artwork.title + '" loading="lazy">' +
                        '</div>' +
                        '<div class="artwork-info">' +
                            '<h4>' + artwork.title + '</h4>' +
                            '<p>' + artwork.material + ' / ' + artwork.size + ' / ' + artwork.year + '</p>' +
                        '</div>';
                    
                    grid.appendChild(card);
                });
                
                tabDiv.appendChild(grid);
                galleryContainer.appendChild(tabDiv);
            });

            const aboutContainer = document.getElementById('about-container');
            let storyHTML = '';
            SITE_DATA.artist.story.forEach(function(p) { storyHTML += '<p>' + p + '</p>'; });
            aboutContainer.innerHTML = 
                '<div class="about-photo">' +
                    '<img src="' + SITE_DATA.artist.photo + '" alt="' + SITE_DATA.artist.firstName + ' ' + SITE_DATA.artist.lastName + '" loading="lazy">' +
                '</div>' +
                '<div class="about-text">' +
                    '<h3>' + SITE_DATA.artist.firstName + ' ' + SITE_DATA.artist.lastName + '</h3>' +
                    storyHTML +
                '</div>';

            const contactsContainer = document.getElementById('contacts-container');
            contactsContainer.innerHTML = 
                '<a href="https://t.me/' + SITE_DATA.contacts.telegram + '" class="contact-btn" target="_blank" rel="noopener">Telegram</a>' +
                '<a href="mailto:' + SITE_DATA.contacts.email + '" class="contact-btn">Почта</a>' +
                '<a href="' + SITE_DATA.contacts.social + '" class="contact-btn" target="_blank" rel="noopener">' + SITE_DATA.contacts.socialLabel + '</a>' +
                '<button class="contact-btn" onclick="showMasterclassToast()">Мастер-классы</button>';

            document.getElementById('footer-container').textContent = SITE_DATA.footer.text;

            setTimeout(checkFadeIn, 100);
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            var tabContent = document.getElementById('tab-' + tabId);
            if (tabContent) tabContent.classList.add('active');
            setTimeout(checkFadeIn, 50);
        }

        function openPopup(category, index) {
            var artwork = SITE_DATA.artworks[category][index];
            document.getElementById('popup-img').src = artwork.img;
            document.getElementById('popup-img').alt = artwork.title;
            document.getElementById('popup-title').textContent = artwork.title;
            document.getElementById('popup-material').textContent = artwork.material;
            document.getElementById('popup-size').textContent = artwork.size;
            document.getElementById('popup-year').textContent = artwork.year;
            var message = encodeURIComponent('Здравствуйте, ' + SITE_DATA.artist.firstName + '! Интересует картина «' + artwork.title + '».');
            document.getElementById('popup-link').href = 'https://t.me/' + SITE_DATA.contacts.telegram + '?text=' + message;
            document.getElementById('popup-overlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closePopup(event) {
            if (event.target === document.getElementById('popup-overlay')) closePopupDirect();
        }

        function closePopupDirect() {
            document.getElementById('popup-overlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePopupDirect();
        });

        function toggleMenu() {
            document.getElementById('burger').classList.toggle('open');
            document.getElementById('nav').classList.toggle('open');
        }

        document.getElementById('nav').addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                document.getElementById('burger').classList.remove('open');
                document.getElementById('nav').classList.remove('open');
            }
        });

        var navLinks = document.querySelectorAll('.nav a');
        window.addEventListener('scroll', function() {
            var scrollPos = window.scrollY + 100;
            var sections = ['hero', 'works', 'about', 'contacts'];
            var current = 'hero';
            sections.forEach(function(id) {
                var section = document.getElementById(id);
                if (section && scrollPos >= section.offsetTop) current = id;
            });
            navLinks.forEach(function(link) {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + current) link.classList.add('active');
            });
            var scrollTopBtn = document.getElementById('scroll-top');
            if (window.scrollY > 500) scrollTopBtn.classList.add('visible');
            else scrollTopBtn.classList.remove('visible');
            checkFadeIn();
        });

        function checkFadeIn() {
            var elements = document.querySelectorAll('.fade-in');
            elements.forEach(function(el) {
                var rect = el.getBoundingClientRect();
                var windowHeight = window.innerHeight || document.documentElement.clientHeight;
                if (rect.top <= windowHeight * 0.85) el.classList.add('visible');
            });
        }

        function showMasterclassToast() {
            var toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        buildSite();
    </script>

</body>
</html>
