<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rulenkova Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 18px; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f2f0ed; color: #2c2c2c; line-height: 1.7; }
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        .header { background: #ffffff; padding: 25px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #ddd8d2; }
        .logo { font-size: 28px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; color: #2d3238; text-decoration: none; }
        .nav { display: flex; align-items: center; }
        .nav a { text-decoration: none; color: #7a7670; margin-left: 40px; font-size: 15px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s; position: relative; }
        .nav a:hover, .nav a.active { color: #2d3238; }
        .nav a.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 1px; background: #2d3238; }
        .burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 5px; }
        .burger span { display: block; width: 25px; height: 2px; background: #2d3238; transition: all 0.3s; }
        .burger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .burger.open span:nth-child(2) { opacity: 0; }
        .burger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
        .hero { width: 100%; height: 70vh; background-color: #e5e1db; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .section { max-width: 1200px; margin: 0 auto; padding: 80px 40px; }
        .section-title { text-align: center; font-size: 26px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 60px; color: #5a5650; }
        .counter { text-align: center; font-size: 15px; color: #a0988e; margin-bottom: 40px; font-weight: 300; letter-spacing: 1px; }
        .counter span { font-weight: 500; color: #2d3238; }
        .catalog-section { background-color: #ffffff; padding: 80px 0; }
        .tabs { display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; }
        .tab-btn { background: none; border: none; font-family: 'Montserrat', sans-serif; font-size: 17px; letter-spacing: 2px; text-transform: uppercase; color: #a0988e; cursor: pointer; padding-bottom: 10px; border-bottom: 1px solid transparent; transition: all 0.3s; }
        .tab-btn.active { color: #2d3238; border-bottom-color: #2d3238; }
        .tab-btn:hover { color: #2d3238; }
        .filter-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .filter-btn { background: none; border: 1px solid #ddd8d2; padding: 8px 20px; font-family: 'Montserrat', sans-serif; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #7a7670; cursor: pointer; transition: all 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: #2d3238; color: #ffffff; border-color: #2d3238; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* MASONRY ГАЛЕРЕЯ — КАК У CARLA GRACE */
        .gallery-masonry { max-width: 1200px; margin: 0 auto; padding: 0 20px; columns: 3; column-gap: 20px; }
        .artwork-card { break-inside: avoid; margin-bottom: 20px; cursor: pointer; transition: transform 0.3s; background: #ffffff; display: block; }
        .artwork-card:hover { transform: translateY(-3px); }
        .artwork-image { width: 100%; background-color: #e5e1db; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; }
        .artwork-image img { width: 100%; height: auto; display: block; }
        .artwork-info { text-align: center; padding-bottom: 5px; }
        .artwork-info h4 { font-size: 15px; font-weight: 400; margin-bottom: 4px; color: #2d3238; }
        .artwork-info p { font-size: 13px; color: #a0988e; font-weight: 300; }
        .no-results { text-align: center; color: #a0988e; padding: 40px; font-style: italic; }

        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
        .popup-overlay.show { display: flex; }
        .popup { background: #ffffff; max-width: 700px; width: 90%; display: flex; flex-direction: column; position: relative; max-height: 90vh; overflow-y: auto; }
        .popup-close { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.9); border: none; font-size: 28px; cursor: pointer; color: #5a5650; z-index: 10; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .popup-close:hover { background: #f2f0ed; }
        .popup-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9); border: none; font-size: 24px; cursor: pointer; color: #5a5650; z-index: 10; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.3s; }
        .popup-arrow:hover { background: #ffffff; }
        .popup-arrow.prev { left: 15px; }
        .popup-arrow.next { right: 15px; }
        .popup-image { width: 100%; background: #e5e1db; display: flex; align-items: center; justify-content: center; position: relative; }
        .popup-image img { width: 100%; height: auto; display: block; max-height: 60vh; object-fit: contain; }
        .popup-details { padding: 30px 40px 40px; }
        .popup-details h3 { font-size: 20px; font-weight: 400; margin-bottom: 15px; letter-spacing: 1px; }
        .popup-details .meta { list-style: none; margin-bottom: 25px; }
        .popup-details .meta li { font-size: 14px; color: #7a7670; margin-bottom: 6px; font-weight: 300; }
        .popup-details .meta li strong { font-weight: 500; color: #2d3238; }
        .btn-price { display: inline-block; background: #2d3238; color: #ffffff; text-decoration: none; padding: 14px 30px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; text-align: center; transition: background 0.3s; border: none; cursor: pointer; }
        .btn-price:hover { background: #4a5058; }

        .news-section { background-color: #ffffff; padding: 80px 0; }
        .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 40px; }
        .news-card { border: 1px solid #ddd8d2; padding: 30px; transition: transform 0.3s; }
        .news-card:hover { transform: translateY(-3px); }
        .news-date { font-size: 13px; color: #a0988e; letter-spacing: 1px; margin-bottom: 10px; }
        .news-card h3 { font-size: 16px; font-weight: 500; margin-bottom: 12px; color: #2d3238; }
        .news-card p { font-size: 14px; color: #7a7670; line-height: 1.6; }

        /* ВЫСТАВКИ */
        .exhibitions-section { background-color: #ffffff; padding: 80px 0; }
        .exhibitions-list { max-width: 900px; margin: 0 auto; padding: 0 40px; }
        .exhibition-item { border-bottom: 1px solid #ddd8d2; padding: 20px 0; }
        .exhibition-item:last-child { border-bottom: none; }
        .exhibition-location { font-size: 14px; font-weight: 500; color: #2d3238; margin-bottom: 4px; }
        .exhibition-details { font-size: 14px; color: #7a7670; font-weight: 300; }
        .exhibition-type { display: inline-block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 10px; margin-top: 6px; }
        .exhibition-type.personal { background: #2d3238; color: #ffffff; }
        .exhibition-type.group { background: #e5e1db; color: #5a5650; }
        .exhibition-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 40px; max-width: 900px; margin-left: auto; margin-right: auto; padding: 0 40px; }
        .exhibition-photo { aspect-ratio: 4/3; background: #e5e1db; overflow: hidden; }
        .exhibition-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .exhibition-photo-placeholder { aspect-ratio: 4/3; background: #e5e1db; display: flex; align-items: center; justify-content: center; color: #a0988e; font-size: 13px; text-align: center; padding: 20px; }

        .about-block { display: flex; gap: 60px; align-items: center; flex-wrap: wrap; }
        .about-photo { flex: 1; min-width: 250px; aspect-ratio: 3 / 4; background-color: #e5e1db; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .about-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .about-text { flex: 1.5; min-width: 280px; }
        .about-text h3 { font-size: 20px; font-weight: 400; letter-spacing: 2px; margin-bottom: 25px; color: #2d3238; }
        .about-text p { font-size: 15px; color: #5a5650; margin-bottom: 15px; font-weight: 300; line-height: 1.8; }
        .contacts-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; align-items: center; }
        .contact-btn { display: inline-block; background: #ffffff; color: #2d3238; text-decoration: none; padding: 16px 40px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #d6cfc7; transition: all 0.3s; text-align: center; cursor: pointer; font-family: 'Montserrat', sans-serif; }
        .contact-btn:hover { background: #2d3238; color: #ffffff; border-color: #2d3238; }
        .contact-email-btn { display: inline-block; background: #ffffff; color: #2d3238; text-decoration: none; padding: 16px 40px; font-size: 14px; letter-spacing: 1px; text-transform: none; border: 1px solid #d6cfc7; transition: all 0.3s; text-align: center; cursor: default; font-family: 'Montserrat', sans-serif; }
        .footer { text-align: center; padding: 40px; font-size: 13px; color: #a0988e; letter-spacing: 1px; font-weight: 300; }
        .scroll-top { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: #ffffff; color: #2d3238; border: 1px solid #d6cfc7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 99; text-decoration: none; }
        .scroll-top.visible { opacity: 1; visibility: visible; }
        .scroll-top:hover { background: #2d3238; color: #ffffff; border-color: #2d3238; }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2d3238; color: #ffffff; padding: 14px 30px; font-size: 14px; letter-spacing: 1px; border-radius: 4px; opacity: 0; visibility: hidden; transition: all 0.4s; z-index: 200; white-space: nowrap; }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        @media (max-width: 768px) {
            html { font-size: 16px; }
            .header { padding: 15px 25px; position: relative; }
            .burger { display: flex; }
            .nav { position: absolute; top: 100%; left: 0; width: 100%; background: #ffffff; flex-direction: column; padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.4s ease; border-bottom: 1px solid #ddd8d2; }
            .nav.open { max-height: 400px; padding: 10px 0; }
            .nav a { margin: 0; padding: 12px 25px; border-top: 1px solid #f5f2ef; font-size: 14px; }
            .nav a.active::after { display: none; }
            .hero { height: 40vh; }
            .gallery-masonry { columns: 2; column-gap: 10px; padding: 0 10px; }
            .artwork-card { margin-bottom: 10px; }
            .news-grid { grid-template-columns: 1fr 1fr; padding: 0 20px; }
            .section { padding: 50px 20px; }
            .popup-details { padding: 25px; }
            .popup-arrow.prev { left: 5px; }
            .popup-arrow.next { right: 5px; }
            .contacts-grid { flex-direction: column; }
            .scroll-top { bottom: 20px; right: 20px; width: 40px; height: 40px; font-size: 16px; }
            .exhibition-gallery { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="#hero" class="logo">Rulenkova</a>
        <button class="burger" id="burger" onclick="toggleMenu()" aria-label="Меню"><span></span><span></span><span></span></button>
        <nav class="nav" id="nav">
            <a href="#hero" class="active">Главная</a>
            <a href="#catalog">Галерея</a>
            <a href="#news">Новости</a>
            <a href="#exhibitions">Выставки</a>
            <a href="#about">Об авторе</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <section class="hero fade-in" id="hero"></section>

    <section class="catalog-section" id="catalog">
        <div class="section-title fade-in">Галерея</div>
        <div class="counter fade-in" id="artwork-counter"></div>
        <div class="tabs fade-in" id="tabs-container"></div>
        <div class="filter-bar fade-in" id="filter-bar"></div>
        <div id="gallery-container"></div>
    </section>

    <section class="news-section" id="news">
        <div class="section-title fade-in">Новости</div>
        <div class="news-grid fade-in" id="news-container"></div>
    </section>

    <section class="exhibitions-section" id="exhibitions">
        <div class="section-title fade-in">Выставки</div>
        <div class="exhibitions-list fade-in" id="exhibitions-list"></div>
        <div class="exhibition-gallery fade-in" id="exhibition-gallery"></div>
    </section>

    <section class="section" id="about">
        <div class="section-title fade-in">Об авторе</div>
        <div class="about-block fade-in" id="about-container"></div>
    </section>

    <section class="section" id="contacts">

    </section>

    <footer class="footer" id="footer-container"></footer>

    <div class="popup-overlay" id="popup-overlay" onclick="closePopup(event)">
        <div class="popup" onclick="event.stopPropagation()">
            <button class="popup-close" onclick="closePopupDirect()" aria-label="Закрыть">&times;</button>
            <button class="popup-arrow prev" onclick="navigatePopup(-1)" aria-label="Предыдущая">←</button>
            <button class="popup-arrow next" onclick="navigatePopup(1)" aria-label="Следующая">→</button>
            <div class="popup-image"><img id="popup-img" src="" alt=""></div>
            <div class="popup-details">
                <h3 id="popup-title">Название</h3>
                <ul class="meta">
                    <li><strong>Материал:</strong> <span id="popup-material">—</span></li>
                    <li><strong>Размер:</strong> <span id="popup-size">—</span></li>
                    <li><strong>Год:</strong> <span id="popup-year">—</span></li>
                </ul>
                <a href="#" class="btn-price" id="popup-link" target="_blank">Узнать цену</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Информация о мастер-классах появится позже</div>
    <a href="#hero" class="scroll-top" id="scroll-top" aria-label="Наверх">↑</a>

                    { title: "ПОРТРЕТ ОДНОГО КИТА", material: "Масло, бумага для масла", size: "18×24 см", year: "2022", img: "images/images/IMG_4045.jpg" }
                ],
                graphics: []
            },
            news: [
                { date: "Май 2026", title: "Выставка в Москве", text: "Персональная выставка «Море и небо» пройдёт в галерее «Арт-пространство» с 15 по 30 мая." },
                { date: "Апрель 2026", title: "Новая серия работ", text: "Завершена работа над серией из 5 картин, посвящённых Чёрному морю. Скоро в галерее." },
                { date: "Март 2026", title: "Мастер-класс", text: "Провела открытый мастер-класс по масляной живописи для студентов художественного училища." }
            ],
            exhibitions: [
                { location: 'Санкт-Петербург, гостиница Репинская', title: '«Те, кто честнее нас!»', date: '10.01–04.02.2023', type: 'group' },
                { location: 'Москва, Центр культуры и спорта', title: '«Вспоминая пленэр 2022»', date: '11.01–29.01.2023', type: 'group' },
                { location: 'Тверь, книжный магазин Абракнигабра', title: '«Дыхание моря»', date: '08.03–06.06.2023', type: 'personal' },
                { location: 'Тверь, Городская дума', title: '«Море вдохновения»', date: '27.11–25.12.2023', type: 'personal' },
                { location: 'Тверь, ОДК Пролетарка', title: '«Дыхание моря»', date: '06.02–29.02.2024', type: 'personal' },
                { location: 'Тверь, ДК Металлист', title: 'Персональная выставка', date: '01.03–05.05.2024', type: 'personal' },
                { location: 'Москва, Гостиный двор', title: 'IV Художественно-промышленный выставка-форум «Уникальная Россия»', date: '02.05–12.05.2024', type: 'group' },
                { location: 'Москва, Гостиный двор', title: 'Юбилейная итоговая художественная выставка «Верность традициям»', date: '02.05–12.05.2024', type: 'group' },
                { location: 'Москва, Гостиный двор', title: 'Первая международная выставка «75 лет дружбе народов»', date: '02.05–12.05.2024', type: 'group' },
                { location: 'Санкт-Петербург, «ЦВММ» Минобороны России', title: 'Международный экспозиционный марафон «Ватерлиния»', date: '15.12.2024–20.03.2025', type: 'group' },
                { location: 'Конаково, ПТЦ «Конаковский фаянс»', title: 'Персональная выставка', date: '20.12.2024–23.01.2025', type: 'personal' },
                { location: 'Тверь, Тверской городской музейно-выставочный центр', title: 'Международная выставка «Арт-прорыв 2025»', date: '21.02.2025–16.02.2025', type: 'group' },
                { location: 'Тверь, Музей живописи Валентина Сидорова', title: '«Крымская весна»', date: '18.03.2025–15.04.2025', type: 'group' },
                { location: 'Санкт-Петербург, Государственный Музей Городской Скульптуры', title: '«QUATRO»', date: '10.04.2025–21.04.2025', type: 'group' },
                { location: 'Тверь, Музей живописи Валентина Сидорова', title: '«Вдохновленная морем»', date: '17.04.2025–15.05.2025', type: 'personal' },
                { location: 'Москва, ВДНХ, Морской Арт Клуб', title: '«Россия морская»', date: '08.08.2025–31.12.2025', type: 'group' },
                { location: 'Санкт-Петербург, Особняк А.П. Брюллова', title: '«Место встречи»', date: '02.10.2025–15.10.2025', type: 'personal' },
                { location: 'Тверь, книжный магазин Абракнигабра', title: '«Море, масло и цветные карандаши»', date: '05.11–15.12.2025', type: 'personal' },
                { location: 'Москва, ЦМД «Бабушкинский-2»', title: 'Персональная выставка', date: '12.01–12.03.2026', type: 'personal' },
                { location: 'Тверь, Тверской городской музейно-выставочный центр', title: 'Международная выставка «Арт-прорыв 2026»', date: '20.02.2026–15.03.2026', type: 'group' }
            ],
            exhibitionPhotos: [],
            contacts: {
                telegram: "rulenkovaee",
                email: "rulenkova.elena@mail.ru",
                social: "https://vk.ru/rulenkova_elena_hudoznik",
                socialLabel: "ВКонтакте"
            },
            footer: {
                text: "© 2026 Rulenkova Art. Все права защищены."
            }
        };

        let currentPopupCategory = null;
        let currentPopupIndex = null;
        let activeFilters = { year: "Все годы", material: "Все материалы" };

        function buildSite() {
            document.getElementById('hero').innerHTML = '<img src="' + SITE_DATA.hero.img + '" alt="' + SITE_DATA.hero.alt + '">';

            const tabsContainer = document.getElementById('tabs-container');
            SITE_DATA.tabs.forEach((tab, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
                btn.textContent = tab.label;
                btn.dataset.tab = tab.id;
                btn.onclick = function() { switchTab(tab.id, this); };
                tabsContainer.appendChild(btn);
            });

            const filterBar = document.getElementById('filter-bar');
            SITE_DATA.filters.years.forEach(year => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (year === 'Все годы' ? ' active' : '');
                btn.textContent = year;
                btn.onclick = function() { setFilter('year', year, this); };
                filterBar.appendChild(btn);
            });
            SITE_DATA.filters.materials.forEach(mat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (mat === 'Все материалы' ? ' active' : '');
                btn.textContent = mat;
                btn.onclick = function() { setFilter('material', mat, this); };
                filterBar.appendChild(btn);
            });

            renderGallery();

            const newsContainer = document.getElementById('news-container');
            SITE_DATA.news.forEach(n => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = '<div class="news-date">' + n.date + '</div><h3>' + n.title + '</h3><p>' + n.text + '</p>';
                newsContainer.appendChild(card);
            });

            const exhibitionsList = document.getElementById('exhibitions-list');
            SITE_DATA.exhibitions.forEach(ex => {
                const item = document.createElement('div');
                item.className = 'exhibition-item';
                item.innerHTML =
                    '<div class="exhibition-location">' + ex.location + '</div>' +
                    '<div class="exhibition-details">' + ex.title + ' — ' + ex.date + '</div>' +
                    '<span class="exhibition-type ' + ex.type + '">' + (ex.type === 'personal' ? 'Персональная' : 'Групповая') + '</span>';
                exhibitionsList.appendChild(item);
            });

            const exhibitionGallery = document.getElementById('exhibition-gallery');
            if (SITE_DATA.exhibitionPhotos.length > 0) {
                SITE_DATA.exhibitionPhotos.forEach(photo => {
                    const photoDiv = document.createElement('div');
                    photoDiv.className = 'exhibition-photo';
                    photoDiv.innerHTML = '<img src="' + photo + '" alt="Фото с выставки" loading="lazy">';
                    exhibitionGallery.appendChild(photoDiv);
                });
            } else {
                exhibitionGallery.style.display = 'none';
            }

            const aboutContainer = document.getElementById('about-container');
            let storyHTML = '';
            SITE_DATA.artist.story.forEach(p => storyHTML += '<p>' + p + '</p>');
            aboutContainer.innerHTML =
                '<div class="about-photo"><img src="' + SITE_DATA.artist.photo + '" alt="' + SITE_DATA.artist.firstName + ' ' + SITE_DATA.artist.lastName + '" loading="lazy"></div>' +
                '<div class="about-text"><h3>' + SITE_DATA.artist.firstName + ' ' + SITE_DATA.artist.lastName + '</h3>' + storyHTML + '</div>';

            document.getElementById('contacts-container').innerHTML =
                '<a href="https://t.me/' + SITE_DATA.contacts.telegram + '" class="contact-btn" target="_blank" rel="noopener">Telegram</a>' +
                '<span class="contact-email-btn">' + SITE_DATA.contacts.email + '</span>' +
                '<a href="' + SITE_DATA.contacts.social + '" class="contact-btn" target="_blank" rel="noopener">' + SITE_DATA.contacts.socialLabel + '</a>' +
                '<button class="contact-btn" onclick="showMasterclassToast()">Мастер-классы</button>';

            document.getElementById('footer-container').textContent = SITE_DATA.footer.text;
            updateCounter();
            setTimeout(checkFadeIn, 100);
        }

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            SITE_DATA.tabs.forEach((tab, tabIndex) => {
                const tabDiv = document.createElement('div');
                tabDiv.className = 'tab-content' + (tabIndex === 0 ? ' active' : '');
                tabDiv.id = 'tab-' + tab.id;
                const grid = document.createElement('div');
                grid.className = 'gallery-masonry fade-in';
                let hasResults = false;
                const artworks = SITE_DATA.artworks[tab.id] || [];
                artworks.forEach((artwork, index) => {
                    if (activeFilters.year !== 'Все годы' && artwork.year !== activeFilters.year) return;
                    if (activeFilters.material !== 'Все материалы' && artwork.material !== activeFilters.material) return;
                    hasResults = true;
                    const card = document.createElement('div');
                    card.className = 'artwork-card';
                    card.onclick = function() { openPopup(tab.id, index); };
                    card.innerHTML =
                        '<div class="artwork-image"><img src="' + artwork.img + '" alt="' + artwork.title + '" loading="lazy"></div>' +
                        '<div class="artwork-info"><h4>' + artwork.title + '</h4><p>' + artwork.material + ' / ' + artwork.size + ' / ' + artwork.year + '</p></div>';
                    grid.appendChild(card);
                });
                if (!hasResults) {
                    const noRes = document.createElement('div');
                    noRes.className = 'no-results';
                    noRes.textContent = tab.id === 'graphics' ? 'Здесь скоро появятся работы' : 'Нет работ, соответствующих фильтру';
                    grid.appendChild(noRes);
                }
                tabDiv.appendChild(grid);
                container.appendChild(tabDiv);
            });
        }

        function updateCounter() {
            let total = 0;
            Object.values(SITE_DATA.artworks).forEach(arr => total += arr.length);
            const word = total % 10 === 1 && total % 100 !== 11 ? 'работа' : total % 10 >= 2 && total % 10 <= 4 && (total % 100 < 10 || total % 100 >= 20) ? 'работы' : 'работ';
            document.getElementById('artwork-counter').innerHTML = 'В коллекции <span>' + total + '</span> ' + word;
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tabContent = document.getElementById('tab-' + tabId);
            if (tabContent) tabContent.classList.add('active');
            setTimeout(checkFadeIn, 50);
        }

        function setFilter(type, value, btn) {
            activeFilters[type] = value;
            const filterBar = document.getElementById('filter-bar');
            const allBtns = filterBar.querySelectorAll('.filter-btn');
            const yearsCount = SITE_DATA.filters.years.length;
            if (type === 'year') {
                allBtns.forEach((b, i) => { if (i < yearsCount) b.classList.toggle('active', b.textContent === value); });
            } else {
                allBtns.forEach((b, i) => { if (i >= yearsCount) b.classList.toggle('active', b.textContent === value); });
            }
            renderGallery();
            setTimeout(checkFadeIn, 50);
        }

        function openPopup(category, index) {
            currentPopupCategory = category;
            currentPopupIndex = index;
            updatePopupContent();
            document.getElementById('popup-overlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            updatePopupArrows();
        }

        function updatePopupContent() {
            const artwork = SITE_DATA.artworks[currentPopupCategory][currentPopupIndex];
            document.getElementById('popup-img').src = artwork.img;
            document.getElementById('popup-img').alt = artwork.title;
            document.getElementById('popup-title').textContent = artwork.title;
            document.getElementById('popup-material').textContent = artwork.material;
            document.getElementById('popup-size').textContent = artwork.size;
            document.getElementById('popup-year').textContent = artwork.year;
            const message = encodeURIComponent('Здравствуйте, ' + SITE_DATA.artist.firstName + '! Интересует картина «' + artwork.title + '».');
            document.getElementById('popup-link').href = 'https://t.me/' + SITE_DATA.contacts.telegram + '?text=' + message;
        }

        function updatePopupArrows() {
            const prevBtn = document.querySelector('.popup-arrow.prev');
            const nextBtn = document.querySelector('.popup-arrow.next');
            const total = SITE_DATA.artworks[currentPopupCategory].length;
            prevBtn.style.display = currentPopupIndex > 0 ? 'flex' : 'none';
            nextBtn.style.display = currentPopupIndex < total - 1 ? 'flex' : 'none';
        }

        function navigatePopup(direction) {
            const total = SITE_DATA.artworks[currentPopupCategory].length;
            currentPopupIndex = (currentPopupIndex + direction + total) % total;
            updatePopupContent();
            updatePopupArrows();
        }

        function closePopup(event) {
            if (event.target === document.getElementById('popup-overlay')) closePopupDirect();
        }

        function closePopupDirect() {
            document.getElementById('popup-overlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePopupDirect();
            if (e.key === 'ArrowLeft' && document.getElementById('popup-overlay').classList.contains('show')) {
                e.preventDefault();
                if (currentPopupIndex > 0) navigatePopup(-1);
            }
            if (e.key === 'ArrowRight' && document.getElementById('popup-overlay').classList.contains('show')) {
                e.preventDefault();
                if (currentPopupIndex < SITE_DATA.artworks[currentPopupCategory].length - 1) navigatePopup(1);
            }
        });

        function toggleMenu() {
            document.getElementById('burger').classList.toggle('open');
            document.getElementById('nav').classList.toggle('open');
        }
        document.getElementById('nav').addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                document.getElementById('burger').classList.remove('open');
                document.getElementById('nav').classList.remove('open');
            }
        });

        const navLinks = document.querySelectorAll('.nav a');
        window.addEventListener('scroll', function() {
            const scrollPos = window.scrollY + 100;
            const sections = ['hero', 'catalog', 'news', 'exhibitions', 'about', 'contacts'];
            let current = 'hero';
            sections.forEach(id => {
                const section = document.getElementById(id);
                if (section && scrollPos >= section.offsetTop) current = id;
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + current) link.classList.add('active');
            });
            document.getElementById('scroll-top').classList.toggle('visible', window.scrollY > 500);
            checkFadeIn();
        });

        function checkFadeIn() {
            document.querySelectorAll('.fade-in').forEach(el => {
                if (el.getBoundingClientRect().top <= (window.innerHeight || document.documentElement.clientHeight) * 0.85) {
                    el.classList.add('visible');
                }
            });
        }

        function showMasterclassToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        buildSite();
    </script>
